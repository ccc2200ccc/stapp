<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>灵境</title>
<style>
html,body{height:100%;margin:0;background:#e7efe8;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
#appFrame{position:fixed;inset:0;z-index:1;width:100%;height:100%;border:0;background:transparent}
/* 99.0.46：右下角常驻 ⟳ 已移除，更新全部由壳自动完成 */
#toast{position:fixed;left:50%;top:calc(10px + env(safe-area-inset-top));transform:translate(-50%,-140%);z-index:2147483200;max-width:min(92vw,420px);padding:10px 16px;border-radius:14px;background:rgba(24,58,42,.94);color:#fff;font-size:13px;line-height:1.5;box-shadow:0 8px 26px rgba(0,0,0,.22);transition:transform .32s cubic-bezier(.2,.9,.25,1.15),opacity .32s;opacity:0;pointer-events:none;text-align:center}
#toast.show{transform:translate(-50%,0);opacity:1}
#updateModal{position:fixed;inset:0;z-index:2147483000;display:none;align-items:flex-end;justify-content:center;padding:18px 18px calc(18px + env(safe-area-inset-bottom));background:rgba(16,28,22,.34)}
#updateModal.show{display:flex}
.update-card{width:min(420px,100%);margin-bottom:0;padding:24px 20px 18px;border:1px solid rgba(255,255,255,.66);border-radius:24px;background:rgba(252,253,251,.94);box-shadow:0 18px 48px rgba(18,39,27,.2)}
.update-kicker{font-size:11px;letter-spacing:.16em;color:#75907d}
.update-card h3{margin:8px 0;font-size:21px}
.update-card p{margin:0;color:#52675b;font-size:14px;line-height:1.7}
.update-notes{max-height:120px;margin-top:12px;overflow:auto;white-space:pre-wrap;color:#31483b;font-size:13px;line-height:1.6}
.update-actions{display:flex;gap:10px;margin-top:18px}
.update-actions button{flex:1;min-height:46px;border-radius:14px;font:inherit}
#updateLater{border:1px solid #d7e2d8;background:#fff;color:#476354}
#updateNow{border:0;background:#305d48;color:#fff}
#updateNow:disabled{opacity:.65}
@media(min-width:761px){#updateModal{align-items:center}.update-card{margin:0}}
</style>
</head>
<body>
<iframe id="appFrame" title="灵境应用"></iframe>
<div id="toast" role="status"></div>
<div id="updateModal" role="dialog" aria-modal="true" aria-labelledby="updateTitle">
  <div class="update-card">
    <div class="update-kicker">APP UPDATE</div>
    <h3 id="updateTitle">版本信息</h3>
    <p id="updateMessage">正在读取发布通道…</p>
    <div class="update-notes" id="updateNotes" hidden=""></div>
    <div class="update-actions">
      <button id="updateLater" type="button">关闭</button>
      <button id="updateNow" type="button">立即更新</button>
    </div>
  </div>
</div>
<script>

/* ============================================================
 * 99.0.46 发布通道启动壳（这是最后一次上传 GitHub 的 index.html）
 *  99.0.45 已解决：元信息 + HTML 一次返回并带 build 戳记，校验通过才记版本；
 *       启动 / 回前台 / bfcache 恢复 / 获得焦点 / 每 45 秒 都检查；
 *       发现新版直接热替换 srcdoc，不用杀后台、不用点、不用刷几次。
 *  99.0.46 两处收尾：
 *   1) 删掉右下角常驻 ⟳：它压在导航栏上，且自动检查本就覆盖全部场景。
 *      手动入口保留在「设置 → 账户与积分 → 版本条 → 检查更新」。
 *   2) 删掉 injectPromptLib 全屏词库层：它拦截「灵感案例」点击后盖住整个
 *      iframe，APP 自己的底部导航栏被遮住，只剩左上角返回按钮。
 *      现在壳只负责装载与更新，词库回到 APP 内 view-cases，导航栏一直在。
 * ============================================================ */
const QCH = new URLSearchParams(location.search).get('ch');
if (QCH) { try { localStorage.setItem('ia_channel_base', QCH); } catch (e) {} }
const CHANNEL = String(QCH || (function () { try { return localStorage.getItem('ia_channel_base'); } catch (e) { return ''; } })()
  || 'https://precious-dango-5e35a8.netlify.app').replace(/\/+$/, '');
const FALLBACK_SITE = 'https://ccc2200ccc.github.io/stapp/';
const BUILD_KEY = 'ia_channel_build_v1';
const HTML_KEY  = 'ia_confirmed_html_v1';      /* 兼容旧壳缓存 */
const VER_KEY   = 'ia_confirmed_version_v2';

const frame = document.getElementById('appFrame');
const modal = document.getElementById('updateModal');
const toastEl = document.getElementById('toast');

let currentBuild = 0;
try { currentBuild = Number(localStorage.getItem(BUILD_KEY) || 0) || 0; } catch (e) {}
let currentVersion = '';
try { currentVersion = localStorage.getItem(VER_KEY) || ''; } catch (e) {}
let checking = false, lastCheck = 0, toastTimer = 0;

function toast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { toastEl.classList.remove('show'); }, 2800);
}

/* 99.0.46：壳不再往 app.html 里注入任何全屏词库层。
   灵感案例走 APP 自带的 #view-cases（内嵌词库 iframe），底部导航栏始终可见。 */

function showApp(html, build, version) {
  frame.hidden = false;
  frame.srcdoc = html;
  if (build != null) { currentBuild = build; try { localStorage.setItem(BUILD_KEY, String(build)); } catch (e) {} }
  if (version != null) { currentVersion = version; try { localStorage.setItem(VER_KEY, version); } catch (e) {} }
}

async function fetchJSON(url) {
  const r = await fetch(url + (url.indexOf('?') === -1 ? '?' : '&') + 't=' + Date.now(),
    { cache: 'no-store', headers: { 'Accept': 'application/json' } });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return await r.json();
}
async function bootCached() {
  let cached = '';
  try { cached = localStorage.getItem(HTML_KEY) || ''; } catch (e) {}
  if (cached && /<html[\s>]/i.test(cached)) { showApp(cached); return; }
  /* 老壳没留缓存：同源拉一份 GitHub Pages 上的 app.html 兜底 */
  try {
    const r = await fetch(FALLBACK_SITE + 'app.html?t=' + Date.now(), { cache: 'no-store' });
    if (r.ok) {
      const t = await r.text();
      if (/<html[\s>]/i.test(t)) showApp(t);
    }
  } catch (e) {}
}
function userIsTyping() {
  try {
    const d = frame.contentDocument;
    if (!d || !d.activeElement) return false;
    const a = d.activeElement, tag = String(a.tagName || '');
    return tag === 'TEXTAREA' || tag === 'INPUT' || !!a.isContentEditable;
  } catch (e) { return false; }
}
function openPanel() {
  modal.classList.add('show');
  document.getElementById('updateMessage').textContent =
    '当前：v' + (currentVersion || '未知') + ' · build ' + currentBuild + '\n发布通道：' + CHANNEL;
  document.getElementById('updateNotes').hidden = true;
  fetchJSON(CHANNEL + '/api/app/version').then(function (v) {
    if (!v || v.ok === false) { document.getElementById('updateMessage').textContent = '发布通道读取失败，点「立即更新」重试'; return; }
    document.getElementById('updateMessage').textContent = v.empty
      ? '通道还没发布过内容。用电脑打开发布台，选 app.html 点一次「发布」即可。'
      : '当前 v' + (currentVersion || '未知') + '（build ' + currentBuild + '） → 通道 v' + v.version + '（build ' + v.build + '）';
    const n = document.getElementById('updateNotes');
    n.hidden = !v.notes; n.textContent = v.notes || '';
  }).catch(function (e) {
    document.getElementById('updateMessage').textContent = '发布通道暂时连不上：' + (e.message || '网络异常');
  });
}

async function checkUpdate(force) {
  const now = Date.now();
  if (checking) return;
  if (!force && now - lastCheck < 1500) return;
  lastCheck = now; checking = true;
  try {
    const v = await fetchJSON(CHANNEL + '/api/app/version');
    if (!v || v.ok === false) throw new Error('通道返回异常');
    if (v.empty) { if (force) toast('通道待发布：先在电脑发布台发一次'); return; }
    if (!force && Number(v.build) <= currentBuild) return;   /* 已是最新 */
    /* 元信息 + HTML 一次拿齐，杜绝版本号与内容错配 */
    const d = await fetchJSON(CHANNEL + '/api/app/latest');
    if (!d || !d.ok || d.empty || !d.html) throw new Error('内容为空');
    if (!/<html[\s>]/i.test(d.html)) throw new Error('内容不完整');
    if (d.html.indexOf('STAPP_BUILD:' + d.build) === -1)
      throw new Error('内容戳记不匹配（疑似缓存旧页），本次不记版本号');
    if (!force && userIsTyping()) { openPanel(); toast('有新版本 v' + d.version + '，点「立即更新」应用'); return; }
    try { localStorage.setItem(HTML_KEY, d.html); } catch (e) {}  /* 配额满也照常本次生效 */
    showApp(d.html, Number(d.build), d.version);
    modal.classList.remove('show');
    toast('已更新到 v' + d.version + ' · 立即生效');
  } catch (e) {
    /* 关键：失败绝不写 build，下次继续重试，不吞版本 */
    if (force) toast('更新失败：' + (e.message || '网络异常') + '（已保留当前版本）');
  } finally {
    checking = false;
  }
}

document.getElementById('updateLater').addEventListener('click', function () { modal.classList.remove('show'); });
document.getElementById('updateNow').addEventListener('click', function () { checkUpdate(true); });

/* 99.0.46：无悬浮按钮，全部自动 —— 回前台 / bfcache / 焦点 / 联网恢复 / 每 45 秒
   都检查一次；手动入口在 APP「设置 → 版本条 → 检查更新」（调 checkUpdate(true)）。 */
document.addEventListener('visibilitychange', function () { if (!document.hidden) checkUpdate(false); });
window.addEventListener('pageshow', function (e) { if (e.persisted) checkUpdate(false); });
window.addEventListener('focus', function () { checkUpdate(false); });
window.addEventListener('online', function () { checkUpdate(false); });
setInterval(function () { if (!document.hidden) checkUpdate(false); }, 45000);

bootCached().then(function () { checkUpdate(false); });
</script>
</body></html>
