<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Glass Image Studio</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#f0f2f8;
  --card:rgba(255,255,255,0.82);
  --border:rgba(255,255,255,0.6);
  --text:#1a1a2e;
  --text2:#8b8fa3;
  --accent:#6366f1;
  --accent2:#8b5cf6;
  --danger:#ef4444;
  --shadow:0 2px 16px rgba(0,0,0,0.05);
  --radius:14px;
}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  background:var(--bg);
  color:var(--text);
  height:100vh;
  overflow:hidden;
  display:flex;
  flex-direction:column;
}
body::before{content:'';position:fixed;top:-20%;left:-10%;width:60%;height:60%;background:radial-gradient(circle,rgba(99,102,241,0.1) 0%,transparent 70%);pointer-events:none}
body::after{content:'';position:fixed;bottom:-20%;right:-10%;width:60%;height:60%;background:radial-gradient(circle,rgba(139,92,246,0.08) 0%,transparent 70%);pointer-events:none}

/* 页面 */
.page{display:none;flex:1;overflow:hidden;padding:0}
.page.active{display:block}

.card{background:var(--card);backdrop-filter:blur(18px) saturate(180%);-webkit-backdrop-filter:blur(18px) saturate(180%);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:8px;box-shadow:var(--shadow)}

/* ===== 生成页 - 固定布局 ===== */
.gen-page{flex:1;display:flex;flex-direction:column;height:calc(100vh - 60px);position:relative}

/* 可滚动内容区 - 到生成按钮为止 */
.gen-scroll{flex:1;overflow-y:auto;padding:8px 12px 0;padding-bottom:60px}

/* 提示词 */
.prompt-box{position:relative;margin-bottom:8px}
.prompt-box textarea{width:100%;height:64px;border:1.5px solid rgba(99,102,241,0.2);border-radius:10px;padding:10px 12px;font-size:14px;resize:none;outline:none;background:rgba(255,255,255,0.85);color:var(--text)}
.prompt-box textarea:focus{border-color:var(--accent)}
.char-count{position:absolute;bottom:6px;right:10px;font-size:11px;color:var(--text2)}

/* 参考图 */
.ref-card{padding:12px 14px !important}
.ref-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.ref-label{font-size:13px;font-weight:600;color:var(--text)}
.ref-clear{font-size:12px;color:var(--danger);cursor:pointer;display:none;padding:2px 8px;border-radius:6px;background:rgba(239,68,68,0.08)}
.ref-clear:hover{background:rgba(239,68,68,0.15)}
.ref-clear.show{display:block}
.ref-strip{display:flex;gap:8px;overflow-x:auto;padding:4px 0}
.ref-strip::-webkit-scrollbar{display:none}
.ref-add{flex-shrink:0;width:56px;height:56px;border:2px dashed rgba(99,102,241,0.3);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:22px;color:var(--accent);cursor:pointer}
.ref-empty{flex:1;font-size:12px;color:var(--text2);display:flex;align-items:center;padding-left:4px}
.ref-thumb{flex-shrink:0;width:56px;height:56px;border-radius:10px;overflow:hidden;position:relative}
.ref-thumb img{width:100%;height:100%;object-fit:cover}
.ref-thumb .x{position:absolute;top:2px;right:2px;width:18px;height:18px;background:rgba(0,0,0,0.55);color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;cursor:pointer}

/* 参数行 */
.param-card{padding:0 14px !important}
.param-row{display:flex;align-items:center;padding:10px 0;border-bottom:1px solid rgba(0,0,0,0.04)}
.param-row:last-child{border-bottom:none}
.param-label{font-size:13px;font-weight:600;color:var(--text);width:52px;flex-shrink:0}
.param-control{flex:1;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.model-select{border:1.5px solid rgba(99,102,241,0.2);border-radius:10px;padding:8px 12px;font-size:13px;background:rgba(255,255,255,0.85);color:var(--text);width:100%;max-width:200px}
.ratio-pills{display:flex;gap:6px;flex-wrap:wrap}
.ratio-pill{padding:6px 14px;border-radius:18px;border:1.5px solid rgba(99,102,241,0.25);font-size:12px;cursor:pointer;background:rgba(255,255,255,0.6);transition:all 0.15s;font-weight:500}
.ratio-pill.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.count-dots{display:flex;gap:8px}
.count-dot{width:30px;height:30px;border-radius:50%;border:1.5px solid rgba(99,102,241,0.25);background:rgba(255,255,255,0.6);font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-weight:500}
.count-dot.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.custom-res{display:flex;align-items:center;gap:8px}
.custom-res input{border:1.5px solid rgba(99,102,241,0.2);border-radius:8px;padding:7px 10px;font-size:13px;width:80px;background:rgba(255,255,255,0.85);color:var(--text);text-align:center}
.custom-res span{font-size:14px;color:var(--text2);font-weight:600}

/* 生成按钮 - 固定在底部 */
.gen-fab{position:fixed;bottom:68px;left:16px;right:16px;height:50px;border-radius:25px;border:none;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-size:16px;font-weight:600;cursor:pointer;box-shadow:0 6px 20px rgba(99,102,241,0.35);z-index:100;display:flex;align-items:center;justify-content:center}
.gen-fab:active{transform:scale(0.98)}

/* 进度条 */
.progress-track{position:fixed;bottom:120px;left:16px;right:16px;height:3px;background:rgba(0,0,0,0.05);border-radius:2px;z-index:99;display:none}
.progress-fill{height:100%;border-radius:2px;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width 0.3s;width:0%}

/* 结果区 - 浮在生成按钮上方 */
.result-area{position:fixed;bottom:124px;left:16px;right:16px;max-height:40vh;overflow-y:auto;z-index:98;display:none}
.result-area.show{display:block}
.result-card{background:var(--card);backdrop-filter:blur(18px) saturate(180%);-webkit-backdrop-filter:blur(18px) saturate(180%);border:1px solid var(--border);border-radius:var(--radius);padding:12px;box-shadow:0 4px 20px rgba(0,0,0,0.1)}
.result-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.result-item{border-radius:10px;overflow:hidden;position:relative;aspect-ratio:1}
.result-item img{width:100%;height:100%;object-fit:cover}
.result-item .overlay{position:absolute;inset:0;background:rgba(0,0,0,0.45);display:flex;align-items:center;justify-content:center;gap:8px;opacity:0;transition:opacity 0.2s}
.result-item:active .overlay{opacity:1}
.result-item .overlay span{color:#fff;font-size:11px;background:rgba(255,255,255,0.2);padding:3px 8px;border-radius:10px;cursor:pointer}

/* 底部导航 */
.tabbar{position:fixed;bottom:0;left:0;right:0;height:60px;background:rgba(255,255,255,0.92);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--border);display:flex;z-index:200}
.tab-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;cursor:pointer;color:var(--text2);font-size:9px}
.tab-item.active{color:var(--accent)}
.tab-item .icon{font-size:20px}

/* 其他页面 */
.input{width:100%;border:1.5px solid rgba(99,102,241,0.2);border-radius:10px;padding:10px 12px;font-size:13px;outline:none;background:rgba(255,255,255,0.85);margin-bottom:8px}
.btn{padding:8px 14px;border-radius:10px;border:none;font-size:13px;cursor:pointer;font-weight:500}
.btn-primary{background:var(--accent);color:#fff}
.btn-ghost{background:rgba(99,102,241,0.1);color:var(--accent)}
.btn-danger{background:rgba(239,68,68,0.1);color:var(--danger)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.section-title{font-size:14px;font-weight:600;margin-bottom:10px}
.prompt-item{padding:10px;border-radius:10px;background:rgba(255,255,255,0.6);margin-bottom:6px;border:1px solid var(--border)}
.prompt-item .text{font-size:13px;margin-bottom:6px}
.prompt-item .actions{display:flex;gap:6px}
.prompt-item .actions .btn{font-size:11px;padding:4px 10px}
.history-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.history-item{border-radius:12px;overflow:hidden;position:relative;aspect-ratio:1}
.history-item img{width:100%;height:100%;object-fit:cover}
.history-item .info{position:absolute;bottom:0;left:0;right:0;padding:6px 8px;background:linear-gradient(transparent,rgba(0,0,0,0.7));color:#fff;font-size:10px}
.upload-area{border:2px dashed rgba(99,102,241,0.3);border-radius:12px;padding:24px 16px;text-align:center;cursor:pointer}
.upload-area .icon{font-size:32px;margin-bottom:6px}
.upload-area .hint{font-size:12px;color:var(--text2)}
#itp-preview{max-width:100%;max-height:140px;border-radius:10px;margin:10px auto;display:none}
.itp-result{margin-top:10px}
.itp-result textarea{width:100%;height:56px;border:1.5px solid rgba(99,102,241,0.2);border-radius:10px;padding:8px;font-size:12px;resize:none}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:300;align-items:center;justify-content:center;padding:20px}
.modal.show{display:flex}
.modal-content{background:#fff;border-radius:16px;padding:16px;max-width:90vw;max-height:80vh;overflow-y:auto}
.modal-content img{width:100%;border-radius:10px;margin-bottom:10px}
.modal-content .info{font-size:12px;color:var(--text2);margin-bottom:4px}
.modal-content .actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
input[type=file]{display:none}
</style>
</head>
<body>

<!-- 生成页 -->
<div class="page active" id="page-gen">
  <div class="gen-page">
    <!-- 可滚动区 -->
    <div class="gen-scroll">
      <!-- 提示词 -->
      <div class="card prompt-box">
        <textarea id="prompt" placeholder="描述你想生成的画面..." maxlength="1000"></textarea>
        <span class="char-count"><span id="char-num">0</span>/1000</span>
      </div>

      <!-- 参考图 -->
      <div class="card ref-card">
        <div class="ref-header">
          <div class="ref-label">参考图</div>
          <span class="ref-clear" id="ref-clear" onclick="clearRefs()">清空</span>
        </div>
        <div class="ref-strip" id="ref-strip">
          <div class="ref-add" id="ref-add" onclick="document.getElementById('ref-input').click()">+</div>
          <div class="ref-empty" id="ref-empty">点击 + 添加，或拖拽/粘贴图片</div>
        </div>
        <input type="file" id="ref-input" accept="image/*" multiple onchange="addRefs(this)">
      </div>

      <!-- 参数区 -->
      <div class="card param-card">
        <div class="param-row">
          <div class="param-label">模型</div>
          <div class="param-control"><select class="model-select" id="model-select"></select></div>
        </div>
        <div class="param-row">
          <div class="param-label">比例</div>
          <div class="param-control">
            <div class="ratio-pills" id="ratio-pills">
              <div class="ratio-pill active" onclick="setRatio(this,'1:1')">1:1</div>
              <div class="ratio-pill" onclick="setRatio(this,'3:4')">3:4</div>
              <div class="ratio-pill" onclick="setRatio(this,'4:3')">4:3</div>
              <div class="ratio-pill" onclick="setRatio(this,'6:19')">6:19</div>
              <div class="ratio-pill" onclick="setRatio(this,'19:6')">19:6</div>
            </div>
          </div>
        </div>
        <div class="param-row">
          <div class="param-label">数量</div>
          <div class="param-control">
            <div class="count-dots">
              <div class="count-dot active" onclick="setCount(this,1)">1</div>
              <div class="count-dot" onclick="setCount(this,2)">2</div>
              <div class="count-dot" onclick="setCount(this,3)">3</div>
              <div class="count-dot" onclick="setCount(this,4)">4</div>
            </div>
          </div>
        </div>
        <div class="param-row" style="border-bottom:none;">
          <div class="param-label">分辨率</div>
          <div class="param-control">
            <div class="custom-res">
              <input type="text" id="res-w" placeholder="宽" value="1024">
              <span>×</span>
              <input type="text" id="res-h" placeholder="高" value="1024">
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- 结果区 - 浮在按钮上方 -->
    <div class="result-area" id="result-area">
      <div class="result-card">
        <div style="font-size:13px;font-weight:600;margin-bottom:8px;">生成结果</div>
        <div class="result-grid" id="result-grid"></div>
      </div>
    </div>
  </div>
</div>

<div class="progress-track" id="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
<button class="gen-fab" id="gen-btn" onclick="startGen()">✦ 开始生成</button>

<!-- 取描述页 -->
<div class="page" id="page-itp">
  <div class="gen-scroll" style="padding:12px;">
    <div class="card">
      <div class="upload-area" onclick="document.getElementById('itp-input').click()">
        <div class="icon">🖼️</div>
        <div>点击或拖拽上传图片</div>
        <div class="hint">自动生成中英文提示词</div>
      </div>
      <input type="file" id="itp-input" accept="image/*" onchange="handleItp(this)">
      <img id="itp-preview">
      <div class="itp-result" id="itp-result"></div>
    </div>
  </div>
</div>

<!-- 提示词页 -->
<div class="page" id="page-prompts">
  <div class="gen-scroll" style="padding:12px;">
    <div class="card">
      <div class="section-title">提示词库</div>
      <div class="row" style="margin-bottom:8px;">
        <input class="input" id="new-prompt" placeholder="新建提示词..." style="flex:1;margin-bottom:0;">
        <button class="btn btn-primary" onclick="addPrompt()">添加</button>
      </div>
      <div id="prompt-list"></div>
    </div>
  </div>
</div>

<!-- 历史页 -->
<div class="page" id="page-history">
  <div class="gen-scroll" style="padding:12px;">
    <div class="card">
      <div class="section-title" style="display:flex;justify-content:space-between;align-items:center;">
        历史生图
        <button class="btn btn-danger" onclick="clearHistory()">清除全部</button>
      </div>
      <div class="history-grid" id="history-grid"></div>
    </div>
  </div>
</div>

<!-- 连接页 -->
<div class="page" id="page-conn">
  <div class="gen-scroll" style="padding:12px;">
    <div class="card">
      <div class="section-title">连接配置</div>
      <input class="input" id="endpoint-name" placeholder="Endpoint 名称">
      <input class="input" id="api-base" placeholder="API Base URL">
      <input class="input" id="api-key" type="password" placeholder="API Key">
      <div class="row" style="margin-top:4px;">
        <button class="btn btn-primary" onclick="saveConfig()">保存</button>
        <button class="btn btn-ghost" onclick="resetConfig()">重置</button>
        <button class="btn btn-ghost" onclick="fetchModels()">获取模型</button>
      </div>
      <div id="conn-status" style="font-size:11px;color:var(--text2);margin-top:8px;"></div>
    </div>
  </div>
</div>

<!-- 底部导航 -->
<div class="tabbar">
  <div class="tab-item active" onclick="switchTab('gen',this)"><div class="icon">🎨</div>生成</div>
  <div class="tab-item" onclick="switchTab('itp',this)"><div class="icon">📝</div>取描述</div>
  <div class="tab-item" onclick="switchTab('prompts',this)"><div class="icon">📚</div>提示词</div>
  <div class="tab-item" onclick="switchTab('history',this)"><div class="icon">🖼️</div>历史</div>
  <div class="tab-item" onclick="switchTab('conn',this)"><div class="icon">⚙️</div>连接</div>
</div>

<div class="modal" id="modal" onclick="if(event.target===this)closeModal()">
  <div class="modal-content" id="modal-content"></div>
</div>

<script>
let config = JSON.parse(localStorage.getItem('cfg') || '{"name":"","base":"","key":"","models":[]}');
let store = JSON.parse(localStorage.getItem('store') || '{"history":[],"prompts":["一只橘猫在樱花树下打盹，吉卜力风格","赛博朋克城市夜景，霓虹灯光，雨夜，8k","水墨山水画，远山如黛，云雾缭绕"]}');
let currentRatio = '1:1', currentCount = 1, refImages = [];

document.getElementById('endpoint-name').value = config.name;
document.getElementById('api-base').value = config.base;
document.getElementById('api-key').value = config.key;
renderModels(); renderPrompts(); renderHistory();
document.getElementById('prompt').addEventListener('input', e => { document.getElementById('char-num').textContent = e.target.value.length; });

function switchTab(name, el) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('page-' + name).classList.add('active');
  document.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active'));
  if (el) el.classList.add('active');
}

function setRatio(el, r) {
  document.querySelectorAll('.ratio-pill').forEach(p => p.classList.remove('active'));
  el.classList.add('active'); currentRatio = r;
}
function setCount(el, n) {
  document.querySelectorAll('.count-dot').forEach(b => b.classList.remove('active'));
  el.classList.add('active'); currentCount = n;
}

function addRefs(input) {
  if (!input.files) return;
  for (let f of input.files) {
    if (refImages.length >= 10) { alert('最多 10 张'); break; }
    const reader = new FileReader();
    reader.onload = e => { refImages.push({name:f.name,data:e.target.result}); renderRefs(); };
    reader.readAsDataURL(f);
  }
  input.value = '';
}
function renderRefs() {
  const bar = document.getElementById('ref-strip');
  bar.innerHTML = '<div class="ref-add" id="ref-add" onclick="document.getElementById(\'ref-input\').click()">+</div>';
  if (refImages.length === 0) {
    bar.innerHTML += '<div class="ref-empty" id="ref-empty">点击 + 添加，或拖拽/粘贴图片</div>';
  }
  refImages.forEach((img, i) => {
    const d = document.createElement('div'); d.className = 'ref-thumb';
    d.innerHTML = `<img src="${img.data}"><div class="x" onclick="removeRef(${i})">×</div>`;
    bar.appendChild(d);
  });
  // 清空按钮
  const clearBtn = document.getElementById('ref-clear');
  if (refImages.length > 0) clearBtn.classList.add('show');
  else clearBtn.classList.remove('show');
}
function removeRef(i) { refImages.splice(i, 1); renderRefs(); }
function clearRefs() { if (refImages.length === 0) return; if (!confirm('清空所有参考图？')) return; refImages = []; renderRefs(); }

function saveConfig() {
  config.name = document.getElementById('endpoint-name').value.trim();
  config.base = document.getElementById('api-base').value.trim().replace(/\/$/, '');
  config.key = document.getElementById('api-key').value.trim();
  localStorage.setItem('cfg', JSON.stringify(config));
  document.getElementById('conn-status').textContent = '✅ 已保存';
}
function resetConfig() {
  config = {name:'',base:'',key:'',models:[]};
  localStorage.setItem('cfg', JSON.stringify(config));
  document.getElementById('endpoint-name').value = ''; document.getElementById('api-base').value = ''; document.getElementById('api-key').value = '';
  renderModels(); document.getElementById('conn-status').textContent = '已重置';
}
async function fetchModels() {
  if (!config.base || !config.key) { alert('请先填写 Base URL 和 Key'); return; }
  document.getElementById('conn-status').textContent = '获取中...';
  try {
    const res = await fetch(config.base + '/models', { headers: {'Authorization':'Bearer ' + config.key} });
    if (!res.ok) throw new Error(res.status);
    const data = await res.json();
    config.models = [...new Set((data.data || []).map(m => m.id || m.name))];
    localStorage.setItem('cfg', JSON.stringify(config));
    renderModels(); document.getElementById('conn-status').textContent = '✅ 获取 ' + config.models.length + ' 个模型';
  } catch(e) { document.getElementById('conn-status').textContent = '❌ ' + e.message; }
}
function renderModels() {
  const sel = document.getElementById('model-select');
  sel.innerHTML = config.models.length ? config.models.map(m => `<option value="${m}">${m}</option>`).join('') : '<option>先获取模型列表</option>';
}

function addPrompt() {
  const v = document.getElementById('new-prompt').value.trim();
  if (!v) return; store.prompts.push(v); localStorage.setItem('store', JSON.stringify(store));
  document.getElementById('new-prompt').value = ''; renderPrompts();
}
function renderPrompts() {
  document.getElementById('prompt-list').innerHTML = store.prompts.map((p,i) => `<div class="prompt-item"><div class="text">${p}</div><div class="actions"><button class="btn btn-primary" onclick="usePrompt(${i})">填入</button><button class="btn btn-ghost" onclick="copyPrompt(${i})">复制</button><button class="btn btn-danger" onclick="delPrompt(${i})">删除</button></div></div>`).join('');
}
function usePrompt(i) { document.getElementById('prompt').value = store.prompts[i]; document.getElementById('char-num').textContent = store.prompts[i].length; switchTab('gen',document.querySelector('.tab-item')); }
function copyPrompt(i) { navigator.clipboard.writeText(store.prompts[i]); }
function delPrompt(i) { store.prompts.splice(i,1); localStorage.setItem('store',JSON.stringify(store)); renderPrompts(); }

async function startGen() {
  const prompt = document.getElementById('prompt').value.trim();
  if (!prompt) { alert('请输入提示词'); return; }
  if (!config.base || !config.key) { alert('请先配置 API'); return; }
  const btn = document.getElementById('gen-btn'); const prog = document.getElementById('progress-track'); const bar = document.getElementById('progress-fill');
  btn.disabled = true; btn.textContent = '生成中...'; prog.style.display = 'block'; bar.style.width = '0%';
  let pct = 0; const timer = setInterval(() => { pct = Math.min(pct + Math.random()*12, 90); bar.style.width = pct + '%'; }, 300);
  try {
    let body = { model: config.models[0] || 'default', prompt: prompt, n: currentCount, size: (() => { const cw=document.getElementById('res-w').value,ch=document.getElementById('res-h').value; if(cw&&ch) return cw+'x'+ch; const p=currentRatio.split(':'); return Math.round(1024*p[0]/Math.max(p[0],p[1]))+'x'+Math.round(1024*p[1]/Math.max(p[0],p[1])); })() };
    if (refImages.length) body.images = refImages.map(i => i.data);
    const res = await fetch(config.base + '/images/generations', { method:'POST', headers:{'Content-Type':'application/json','Authorization':'Bearer '+config.key}, body:JSON.stringify(body) });
    clearInterval(timer); bar.style.width='100%'; setTimeout(()=>prog.style.display='none',400);
    if (!res.ok) throw new Error(res.status+' '+await res.text());
    const data = await res.json();
    showResults((data.data||[]).map(item=>item.url||(item.b64_json?'data:image/png;base64,'+item.b64_json:'')).filter(Boolean), prompt, body);
  } catch(e) {
    clearInterval(timer); prog.style.display='none';
    const demoUrls = []; for(let i=0;i<currentCount;i++) demoUrls.push('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400"><rect fill="%23ddd" width="400" height="400"/><text x="50%" y="50%" text-anchor="middle" dy=".3em" fill="%23999" font-size="16">DEMO '+(i+1)+'</text></svg>');
    showResults(demoUrls, prompt, {model:config.models[0]||'demo',size:'1024x1024'});
    document.getElementById('conn-status').textContent = '演示模式（API 未连通）';
  }
  btn.disabled = false; btn.textContent = '✦ 开始生成';
}

function showResults(urls, prompt, body) {
  const area = document.getElementById('result-area'); const grid = document.getElementById('result-grid');
  area.classList.add('show'); grid.innerHTML = '';
  urls.forEach(url => {
    const div = document.createElement('div'); div.className = 'result-item';
    div.innerHTML = `<img src="${url}"><div class="overlay"><span onclick="downloadImg('${url}')">下载</span><span onclick="copyText('${prompt.replace(/'/g,"\\'")}')">复制提示词</span></div>`;
    grid.appendChild(div);
    store.history.unshift({url,prompt,model:body.model,size:body.size,ratio:currentRatio,time:Date.now()});
  });
  localStorage.setItem('store', JSON.stringify(store)); renderHistory();
}

async function handleItp(input) {
  if (!input.files || !input.files[0]) return;
  const file = input.files[0];
  document.getElementById('itp-preview').src = URL.createObjectURL(file); document.getElementById('itp-preview').style.display = 'block';
  document.getElementById('itp-result').innerHTML = '<div style="padding:10px;color:var(--text2);font-size:12px;">分析中...</div>';
  if (!config.base || !config.key) { document.getElementById('itp-result').innerHTML = '<div style="color:var(--danger);font-size:12px;">请先配置 API</div>'; return; }
  try {
    const reader = new FileReader();
    reader.onload = async e => {
      const base64 = e.target.result.split(',')[1];
      const res = await fetch(config.base + '/chat/completions', { method:'POST', headers:{'Content-Type':'application/json','Authorization':'Bearer '+config.key}, body:JSON.stringify({model:config.models[0]||'default',messages:[{role:'user',content:[{type:'text',text:'Describe this image in English and Chinese for image generation. Format: EN: [english] CN: [chinese]'},{type:'image_url',image_url:{url:'data:image/jpeg;base64,'+base64}}]}]}) });
      const data = await res.json(); const text = data.choices?.[0]?.message?.content || '未能识别';
      const en = text.match(/EN:\s*(.+?)(?=CN:|$)/s)?.[1]?.trim() || ''; const cn = text.match(/CN:\s*(.+)/s)?.[1]?.trim() || '';
      document.getElementById('itp-result').innerHTML = `<div style="margin-bottom:6px;"><b style="font-size:12px;">EN:</b><textarea readonly style="width:100%;height:44px;border:1.5px solid rgba(99,102,241,0.2);border-radius:8px;padding:6px;font-size:11px;margin-top:2px;">${en}</textarea><button class="btn btn-ghost" style="margin-top:2px;font-size:11px;padding:3px 8px;" onclick="navigator.clipboard.writeText(this.previousElementSibling.value)">复制</button></div><div><b style="font-size:12px;">中文:</b><textarea readonly style="width:100%;height:44px;border:1.5px solid rgba(99,102,241,0.2);border-radius:8px;padding:6px;font-size:11px;margin-top:2px;">${cn}</textarea><button class="btn btn-ghost" style="margin-top:2px;font-size:11px;padding:3px 8px;" onclick="navigator.clipboard.writeText(this.previousElementSibling.value)">复制</button></div><button class="btn btn-primary" style="margin-top:6px;font-size:12px;" onclick="document.getElementById('prompt').value=document.getElementById('itp-result').querySelector('textarea').value;switchTab('gen',document.querySelector('.tab-item'))">回填到生成</button>`;
    };
    reader.readAsDataURL(file);
  } catch(e) { document.getElementById('itp-result').innerHTML = '<div style="color:var(--danger);font-size:12px;">失败: ' + e.message + '</div>'; }
}

function renderHistory() { document.getElementById('history-grid').innerHTML = store.history.map((h,i) => `<div class="history-item" onclick="showDetail(${i})"><img src="${h.url}"><div class="info">${h.model||'unknown'} · ${h.ratio||''}</div></div>`).join(''); }
function clearHistory() { if(!confirm('清除全部？')) return; store.history=[]; localStorage.setItem('store',JSON.stringify(store)); renderHistory(); }
function showDetail(i) {
  const h = store.history[i]; document.getElementById('modal').classList.add('show');
  document.getElementById('modal-content').innerHTML = `<img src="${h.url}"><div class="info"><b>模型:</b> ${h.model||'unknown'}</div><div class="info"><b>尺寸:</b> ${h.size||'N/A'}</div><div class="info"><b>比例:</b> ${h.ratio||'N/A'}</div><div class="info"><b>提示词:</b> ${h.prompt}</div><div class="actions"><button class="btn btn-primary" onclick="copyText('${h.prompt.replace(/'/g,"\\'")}')">复制提示词</button><button class="btn btn-ghost" onclick="downloadImg('${h.url}')">下载</button><button class="btn btn-danger" onclick="delHistory(${i})">删除</button><button class="btn btn-ghost" onclick="closeModal()">关闭</button></div>`;
}
function delHistory(i) { store.history.splice(i,1); localStorage.setItem('store',JSON.stringify(store)); renderHistory(); closeModal(); }
function closeModal() { document.getElementById('modal').classList.remove('show'); }
function copyText(t) { navigator.clipboard.writeText(t); }
function downloadImg(url) { const a=document.createElement('a'); a.href=url; a.download='ai-image.png'; a.click(); }

document.addEventListener('dragover', e => e.preventDefault());
document.addEventListener('drop', e => {
  e.preventDefault();
  if (e.dataTransfer.files) { for (let f of e.dataTransfer.files) { if (!f.type.startsWith('image/')) continue; if (refImages.length >= 10) break; const reader = new FileReader(); reader.onload = ev => { refImages.push({name:f.name,data:ev.target.result}); renderRefs(); }; reader.readAsDataURL(f); } }
});
document.addEventListener('paste', e => {
  if (e.clipboardData.files) { for (let f of e.clipboardData.files) { if (!f.type.startsWith('image/')) continue; if (refImages.length >= 10) break; const reader = new FileReader(); reader.onload = ev => { refImages.push({name:f.name,data:ev.target.result}); renderRefs(); }; reader.readAsDataURL(f); } }
});
document.addEventListener('keydown', e => { if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') startGen(); if (e.key === 'Escape') closeModal(); });
</script>
</body>
</html>
