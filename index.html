<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f6f4">
<title>AI 生图工作台</title>
<style>
:root{
  --bg:#f7f6f4;
  --surface:#ffffff;
  --text:#222222;
  --text-soft:#555555;
  --muted:#888888;
  --line:#e8e6e2;
  --line-strong:#d4d1cb;
  --accent:#222222;
  --accent-soft:#f0eeea;
  --danger:#b5493a;
  --radius-s:6px;
  --radius-m:10px;
  --radius-l:14px;
  --radius-pill:999px;
  --shadow-soft:0 1px 3px rgba(0,0,0,.04), 0 4px 16px rgba(0,0,0,.03);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
[hidden]{display:none !important;}
html,body{height:100%;}
body{
  margin:0; background:#eae8e4; color:var(--text);
  font-family:"Inter","Helvetica Neue",-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased; display:flex; justify-content:center;
}
.app{
  width:100%; max-width:540px; height:100dvh; display:flex; flex-direction:column;
  background:var(--bg); overflow:hidden; position:relative;
  box-shadow:0 0 60px rgba(0,0,0,.06);
}

/* ---------- 顶栏 ---------- */
.topbar{
  flex:0 0 auto; display:flex; align-items:center; justify-content:space-between;
  padding:18px 20px 12px; gap:12px;
  border-bottom:1px solid var(--line);
  background:var(--bg);
}
.brand{display:flex; align-items:center; gap:10px; flex:0 0 auto;}
.logo{
  width:28px; height:28px; border-radius:50%; display:grid; place-items:center;
  font-size:13px; color:#fff; background:var(--accent);
  letter-spacing:0;
}
.topbar h1{
  margin:0; font-size:16px; font-weight:600; letter-spacing:.08em;
  color:var(--text); text-transform:uppercase;
}
.model-badge{
  font-size:10.5px; padding:6px 12px; border-radius:var(--radius-pill);
  color:var(--muted); background:var(--surface); border:1px solid var(--line);
  max-width:160px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  letter-spacing:.02em;
}

/* ---------- 视图容器 ---------- */
#views{
  flex:1; min-height:0; overflow:hidden;
  padding:16px 18px 12px;
  display:flex; flex-direction:column;
}
.view{display:none;}
.view.active{
  display:block; flex:1; min-height:0; overflow-y:auto;
  animation:fade .22s ease; scrollbar-width:none;
}
.view.active::-webkit-scrollbar{display:none;}
@keyframes fade{from{opacity:0;} to{opacity:1;}}
#view-generate.active{
  display:flex; flex-direction:column; overflow:hidden;
}

/* ---------- 通用组件 ---------- */
.card{
  background:var(--surface); border:1px solid var(--line);
  border-radius:var(--radius-l); padding:18px; margin-bottom:16px;
  box-shadow:var(--shadow-soft);
}
.field-label{
  display:block; font-size:11px; color:var(--muted); margin:0 0 8px;
  font-weight:500; letter-spacing:.06em; text-transform:uppercase;
}
.field-label:not(:first-child){margin-top:18px;}
.input,.textarea,.select{
  width:100%; background:var(--bg); border:1px solid var(--line);
  border-radius:var(--radius-m); color:var(--text);
  padding:12px 14px; font-size:14px; font-family:inherit; outline:none;
  transition:border-color .2s;
}
.input:focus,.textarea:focus,.select:focus{border-color:var(--text);}
.input::placeholder,.textarea::placeholder{color:#b0aca5;}
.textarea{resize:none; line-height:1.6; min-height:56px;}
.select{
  appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 16px) 50%,calc(100% - 11px) 50%;
  background-size:5px 5px,5px 5px; background-repeat:no-repeat;
  padding-right:32px;
}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
.row{display:flex;} .gap8{gap:8px;} .gap10{gap:10px;} .flex1{flex:1;} .full{width:100%;}

/* 主按钮：炭黑填充，胶囊形，轻微上浮 */
.primary-btn{
  position:relative; overflow:hidden; width:100%; height:52px;
  border:1px solid var(--accent); border-radius:var(--radius-pill);
  background:var(--accent); cursor:pointer; font-family:inherit; margin:0; padding:0;
  transition:opacity .2s, transform .15s;
}
.primary-btn:active{transform:scale(.99); opacity:.92;}
.primary-btn:disabled{cursor:default; opacity:.7;}
.btn-fill{
  position:absolute; left:0; top:0; bottom:0; width:0%;
  background:rgba(255,255,255,.18);
  transition:width .25s ease; pointer-events:none;
}
.btn-text{
  position:relative; z-index:1; display:flex; align-items:center; justify-content:center; gap:8px;
  font-size:12px; font-weight:600; color:#fff; letter-spacing:.1em; text-transform:uppercase;
}

/* 次级按钮：白底细边 */
.ghost-btn{
  background:var(--surface); border:1px solid var(--line);
  color:var(--text); border-radius:var(--radius-pill);
  padding:12px 18px; font-size:12px; font-weight:500; cursor:pointer; font-family:inherit;
  letter-spacing:.04em; transition:border-color .2s, background .2s;
  margin-bottom:10px;
}
.ghost-btn:active{background:var(--bg); border-color:var(--line-strong);}
.ghost-btn.danger{color:var(--danger); border-color:#e8d5d1;}

/* 胶囊小按钮 */
.chip-btn{
  background:var(--surface); border:1px solid var(--line);
  color:var(--text-soft); border-radius:var(--radius-pill);
  padding:8px 16px; font-size:11px; cursor:pointer; font-family:inherit;
  font-weight:500; letter-spacing:.04em; white-space:nowrap;
  transition:border-color .2s, color .2s;
}
.chip-btn:active{border-color:var(--text); color:var(--text);}

/* 文字按钮 */
.text-btn{
  background:none; border:0; color:var(--muted); font-size:11.5px;
  cursor:pointer; font-family:inherit; padding:4px 2px; font-weight:500;
  letter-spacing:.03em;
}
.text-btn.accent{color:var(--text); font-weight:600;}
.text-btn.danger{color:var(--danger);}

/* 标签 */
.tag{
  font-size:10.5px; padding:5px 11px; border-radius:var(--radius-pill);
  background:var(--bg); color:var(--muted); border:1px solid var(--line);
  white-space:nowrap; letter-spacing:.02em;
}
.link{color:var(--text); cursor:pointer; text-decoration:underline; text-underline-offset:2px;}

/* ============================================================
 * 生图页（一屏卡片）
 * ============================================================ */
.gen-card{
  flex:1; min-height:0; margin:0; padding:18px;
  display:flex; flex-direction:column; gap:14px; overflow:hidden;
  background:var(--surface); border:1px solid var(--line);
  border-radius:var(--radius-l); box-shadow:var(--shadow-soft);
}

/* 模型行 */
.model-row{flex:0 0 auto; height:38px; display:flex; align-items:center; gap:12px;}
.model-label{
  font-size:10.5px; color:var(--muted); font-weight:500;
  letter-spacing:.06em; text-transform:uppercase; flex:0 0 auto;
}
.model-chip{
  flex:1; min-width:0; height:100%; display:flex; align-items:center; justify-content:space-between; gap:8px;
  background:var(--bg); border:1px solid var(--line); border-radius:var(--radius-m);
  padding:0 14px; font-size:12px; font-weight:500; color:var(--text);
  font-family:inherit; cursor:pointer; transition:border-color .2s;
}
.model-chip:active{border-color:var(--text);}
.model-chip-name{overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.model-chip svg{flex:0 0 auto; color:var(--muted);}

/* 提示词块 */
.prompt-block{flex:1 1 auto; min-height:0; display:flex; flex-direction:column; gap:8px;}
.block-head{display:flex; align-items:center; justify-content:space-between; flex:0 0 auto;}
.block-head > span{
  font-size:10.5px; color:var(--muted); font-weight:500;
  letter-spacing:.06em; text-transform:uppercase;
}
.head-actions{display:flex; gap:16px;}
.mini-text{
  background:none; border:0; color:var(--text-soft); font-size:11px;
  font-weight:500; cursor:pointer; font-family:inherit; padding:0;
  letter-spacing:.03em;
}
.gen-textarea{flex:1; min-height:56px; height:auto;}

/* 参考图行 */
.ref-row{flex:0 0 auto; height:44px; display:flex; gap:10px; align-items:center;}
.ref-btn{
  flex:1; height:100%; display:flex; align-items:center; justify-content:center; gap:8px;
  background:var(--bg); border:1px dashed var(--line-strong); border-radius:var(--radius-m);
  color:var(--muted); font-size:11.5px; font-weight:500; font-family:inherit;
  cursor:pointer; transition:border-color .2s, color .2s;
}
.ref-btn.drag{border-color:var(--text); color:var(--text);}
.ref-preview{
  position:relative; width:44px; height:44px; border-radius:var(--radius-m);
  flex:0 0 auto; border:1px solid var(--line); padding:2px; background:var(--bg);
}
.ref-preview img{width:100%; height:100%; object-fit:cover; display:block; border-radius:calc(var(--radius-m) - 2px);}
.ref-remove{
  position:absolute; top:-6px; right:-6px; width:20px; height:20px; border-radius:50%;
  border:1px solid var(--line); background:var(--surface); color:var(--text-soft);
  font-size:10px; cursor:pointer; display:grid; place-items:center;
  box-shadow:0 2px 6px rgba(0,0,0,.08);
}

/* 比例 */
.ratio-block{flex:0 0 auto; display:flex; flex-direction:column; gap:8px;}
.ratio-group{display:grid; grid-template-columns:repeat(4,1fr); gap:8px;}
.ratio-btn{
  height:44px; background:var(--bg); border:1px solid var(--line);
  border-radius:var(--radius-m); display:flex; flex-direction:column;
  align-items:center; justify-content:center; gap:4px;
  color:var(--muted); font-size:10px; font-weight:500; font-family:inherit;
  cursor:pointer; transition:border-color .2s, color .2s, background .2s;
  letter-spacing:.02em;
}
.ratio-btn .shape{display:block; border:1.4px solid currentColor; border-radius:1px;}
.ratio-btn.active{
  border-color:var(--text); color:var(--text); background:var(--surface);
}

/* 分辨率 / 数量 */
.meta-row{flex:0 0 auto; height:44px; display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.meta-item{
  display:flex; align-items:center; gap:8px; padding:0 14px;
  border-radius:var(--radius-m); background:var(--bg); border:1px solid var(--line);
}
.meta-item .mini-label{
  font-size:10.5px; color:var(--muted); font-weight:500;
  letter-spacing:.04em; flex:0 0 auto;
}
.meta-item select{
  flex:1; min-width:0; background:transparent; border:0; box-shadow:none;
  padding:0; font-size:13px; font-weight:600; color:var(--text);
  text-align:right; height:100%; letter-spacing:.02em;
}
.res-value{
  flex:1; text-align:right; font-size:13px; font-weight:600;
  color:var(--text); letter-spacing:.06em;
}

/* 结果缩略图行 */
.gen-result{flex:0 0 auto;}
.gen-result:empty{display:none;}
.result-row{display:flex; gap:8px; overflow-x:auto; scrollbar-width:none; padding-bottom:2px;}
.result-row::-webkit-scrollbar{display:none;}
.result-thumb{
  width:52px; height:52px; flex:0 0 auto; object-fit:cover;
  border-radius:var(--radius-s); cursor:pointer; border:1px solid var(--line);
  transition:border-color .2s;
}
.result-thumb:active{border-color:var(--text);}

/* ---------- 历史 ---------- */
.section-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:18px;}
.section-head h2{
  margin:0; font-size:14px; font-weight:600;
  letter-spacing:.05em; text-transform:uppercase;
}
.count{font-size:11px; color:var(--muted); font-weight:400; margin-left:6px;}
.hist-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:12px;}
.hist-item{
  position:relative; border-radius:var(--radius-m); overflow:hidden;
  aspect-ratio:1; cursor:pointer; background:var(--surface);
  border:1px solid var(--line);
}
.hist-item img{
  width:100%; height:100%; object-fit:cover; display:block;
  transition:opacity .3s;
}
.hist-item:active img{opacity:.8;}
.hist-badge{
  position:absolute; right:8px; top:8px; background:rgba(255,255,255,.92);
  color:var(--text); font-size:10px; padding:3px 9px;
  border-radius:var(--radius-pill); backdrop-filter:blur(6px);
  letter-spacing:.02em;
}
.hist-ratio{
  position:absolute; left:8px; bottom:8px; background:rgba(255,255,255,.92);
  color:var(--text); font-size:10px; padding:3px 9px;
  border-radius:var(--radius-pill); backdrop-filter:blur(6px);
  letter-spacing:.02em;
}
.empty{
  text-align:center; padding:56px 20px; color:var(--muted); grid-column:1/-1;
}
.empty-icon{font-size:34px; margin-bottom:12px; opacity:.5;}
.empty p{margin:0 0 6px; font-size:14px; color:var(--text); font-weight:500;}
.empty span{font-size:12px;}

/* ---------- 提示词反推 ---------- */
.prompt-card{
  background:var(--surface); border:1px solid var(--line);
  border-radius:var(--radius-m); padding:16px; margin-bottom:12px;
}
.prompt-top{display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:10px;}
.prompt-title{font-weight:600; font-size:13px; letter-spacing:.02em;}
.prompt-text{margin:0; font-size:12px; color:var(--muted); line-height:1.65;}
.vision-text{
  white-space:pre-wrap; word-break:break-word; color:var(--text-soft);
  font-size:12.5px; line-height:1.75;
  background:var(--bg); padding:14px 16px; border-radius:var(--radius-m);
  margin:0; border:1px solid var(--line);
}
.vision-thumb{
  width:52px; height:52px; border-radius:var(--radius-s);
  object-fit:cover; flex:0 0 auto; border:1px solid var(--line);
}
.vision-row{display:flex; gap:12px; align-items:flex-start;}
.vision-row-main{min-width:0; flex:1;}
.clamp3{display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden;}

/* 上传区 */
.uploader{
  border-radius:var(--radius-m); min-height:116px; cursor:pointer;
  display:flex; align-items:center; justify-content:center; padding:16px;
  position:relative; background:var(--bg); border:1px dashed var(--line-strong);
  transition:border-color .2s, background .2s;
}
.uploader.drag{border-color:var(--text); background:var(--surface);}
.upload-inner{text-align:center; color:var(--muted); pointer-events:none;}
.upload-inner p{margin:9px 0 4px; font-size:13px; color:var(--text); font-weight:500;}
.upload-inner span{font-size:11px;}
.upload-preview{position:relative; width:100%;}
.upload-preview img{width:100%; max-height:230px; object-fit:contain; border-radius:var(--radius-m); display:block;}
.remove-btn{
  position:absolute; top:8px; right:8px; width:28px; height:28px; border-radius:50%;
  border:1px solid var(--line); background:rgba(255,255,255,.9); color:var(--text);
  font-size:12px; cursor:pointer; backdrop-filter:blur(6px);
}
.api-hint{font-size:11.5px; color:var(--muted); text-align:center; line-height:1.6; margin:12px 0 0;}

/* ---------- 案例 ---------- */
.case-card{
  background:var(--surface); border:1px solid var(--line);
  border-radius:var(--radius-l); overflow:hidden; margin-bottom:16px;
}
.case-thumb{height:104px; display:grid; place-items:center; font-size:34px;}
.case-body{padding:16px 16px 18px;}
.case-body h3{margin:0 0 8px; font-size:14px; font-weight:600; letter-spacing:.02em;}
.case-prompt{
  margin:0 0 10px; font-size:12px; color:var(--muted); line-height:1.65;
  display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden;
}
.case-tags{display:flex; gap:8px; flex-wrap:wrap;}
.case-tip{
  font-size:11.5px; color:var(--text-soft); line-height:1.6; margin:12px 0;
  background:var(--bg); border-radius:var(--radius-m); padding:11px 13px;
  border:1px solid var(--line);
}
.case-body .ghost-btn{margin-bottom:0; margin-top:2px;}

/* ---------- 设置 ---------- */
.input-with-btn{position:relative;}
.input-with-btn .input{padding-right:62px;}
.eye-btn{
  position:absolute; right:8px; top:50%; transform:translateY(-50%);
  background:none; border:0; color:var(--text-soft); font-size:11.5px;
  cursor:pointer; padding:8px; font-family:inherit; font-weight:500;
  letter-spacing:.04em;
}
.hint-text{font-size:11px; color:var(--muted); margin:10px 0 0; line-height:1.6;}
.type-pill{
  display:inline-flex; align-items:center; gap:6px; font-size:10.5px;
  color:var(--text-soft); background:var(--bg); padding:6px 12px;
  border-radius:var(--radius-pill); border:1px solid var(--line);
  letter-spacing:.04em;
}
.muted{color:var(--muted);} .small{font-size:11.5px;} .center{text-align:center;}
p.muted.center{margin:18px 0 8px;}

/* ---------- 底部导航 ---------- */
.bottom-nav{
  flex:0 0 auto; display:grid; grid-template-columns:repeat(5,1fr);
  background:var(--surface); border-top:1px solid var(--line);
  padding:10px 6px calc(10px + env(safe-area-inset-bottom));
}
.nav-btn{
  background:none; border:0; color:var(--muted); display:flex; flex-direction:column;
  align-items:center; gap:5px; font-size:10px; padding:2px 0;
  cursor:pointer; font-family:inherit; font-weight:500; letter-spacing:.03em;
  transition:color .2s;
}
.nav-ico{
  width:36px; height:26px; display:grid; place-items:center;
  border-radius:var(--radius-pill); transition:background .2s, color .2s;
}
.nav-btn svg{
  width:19px; height:19px; fill:none; stroke:currentColor;
  stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round;
}
.nav-btn.active{color:var(--text);}
.nav-btn.active .nav-ico{background:var(--accent-soft);}

/* ---------- 弹窗 ---------- */
.modal{
  position:fixed; inset:0; background:rgba(30,28,25,.4);
  display:none; align-items:flex-end; justify-content:center;
  z-index:80; backdrop-filter:blur(6px);
}
.modal.show{display:flex;}
.modal-card{
  background:var(--bg); width:100%; max-width:540px; max-height:88dvh;
  border-radius:20px 20px 0 0; display:flex; flex-direction:column;
  overflow:hidden; animation:slideUp .3s cubic-bezier(.22,1,.36,1);
  border-top:1px solid var(--line);
}
@keyframes slideUp{from{transform:translateY(50px); opacity:.4;} to{transform:none; opacity:1;}}
.modal-head{
  display:flex; align-items:center; justify-content:space-between;
  padding:18px 22px 14px; font-size:11.5px; color:var(--muted); font-weight:500;
  border-bottom:1px solid var(--line);
}
.modal-head .icon-btn{
  background:var(--surface); border:1px solid var(--line); color:var(--text);
  font-size:13px; cursor:pointer; padding:0; width:32px; height:32px;
  border-radius:50%; display:grid; place-items:center;
}
.modal-body{overflow-y:auto; padding:16px 22px calc(26px + env(safe-area-inset-bottom)); scrollbar-width:thin;}
.detail-imgs{display:grid; gap:10px; margin-bottom:18px;}
.detail-img{width:100%; border-radius:var(--radius-m); display:block; cursor:pointer; border:1px solid var(--line);}
.detail-label{
  font-size:10.5px; color:var(--muted); margin-bottom:7px; font-weight:500;
  letter-spacing:.06em; text-transform:uppercase;
}
.detail-block{margin-bottom:16px;}
.detail-text{
  margin:0; font-size:12.5px; line-height:1.7; color:var(--text-soft);
  background:var(--bg); padding:13px 15px; border-radius:var(--radius-m);
  white-space:pre-wrap; border:1px solid var(--line);
}
.detail-tags{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:18px;}
.detail-actions{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.detail-actions .ghost-btn{margin:0;}

/* 模型列表 */
.model-list{display:flex; flex-direction:column; gap:8px; margin-top:14px; max-height:42dvh; overflow-y:auto; scrollbar-width:thin;}
.model-item{
  display:flex; align-items:center; justify-content:space-between; gap:10px;
  width:100%; text-align:left; background:var(--surface);
  border:1px solid var(--line); color:var(--text); border-radius:var(--radius-m);
  padding:14px 16px; font-size:12.5px; font-family:inherit; cursor:pointer;
  word-break:break-all; line-height:1.45; font-weight:400;
  transition:border-color .2s;
}
.model-item.active{border-color:var(--text); font-weight:500;}
.model-item .tick{color:var(--text); font-weight:700; flex:0 0 auto;}

/* ============================================================
 * 图片查看器
 * ============================================================ */
.img-viewer{
  position:fixed; inset:0; z-index:150;
  background:#111110;
  display:none; flex-direction:column;
}
.img-viewer.show{display:flex; animation:viewerFade .2s ease;}
@keyframes viewerFade{from{opacity:0;} to{opacity:1;}}

.viewer-top{
  flex:0 0 auto; display:flex; align-items:center; justify-content:space-between;
  padding:16px 18px calc(16px + env(safe-area-inset-top)); gap:12px;
}
.v-icon-btn{
  width:36px; height:36px; border-radius:50%; border:1px solid rgba(255,255,255,.16);
  background:rgba(255,255,255,.06); color:#eee;
  display:grid; place-items:center; cursor:pointer;
  font-size:15px; font-family:inherit; font-weight:400;
  backdrop-filter:blur(6px); transition:background .16s;
}
.v-icon-btn:active{background:rgba(255,255,255,.16);}
.v-pager{color:rgba(255,255,255,.55); font-size:11.5px; font-weight:400; letter-spacing:.06em;}

.viewer-stage{
  flex:1; min-height:0; position:relative;
  display:flex; align-items:center; justify-content:center;
  overflow:hidden; touch-action:none; cursor:grab;
}
.viewer-stage:active{cursor:grabbing;}
.viewer-stage img{
  max-width:100%; max-height:100%; object-fit:contain;

}
.v-arrow{

}
.v-arrow-prev{left:10px;}
.v-arrow-next{right:10px;}
.v-arrow:active{background:rgba(255,255,255,.14);}

.viewer-bottom{

/* ---------- Toast / Spinner ---------- */
#toast{

<script>
/* ============================================================
 * 基础工具
 * ============================================================ */
const $  = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

const store = {
  get(k, d = null) {
    try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); }
    catch { return d; }
  },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch { return false; } },
  del(k) { try { localStorage.removeItem(k); } catch {} }
};

function escapeHtml(s = '') {
  return String(s).replace(/[&<>"']/g, m => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[m]));
}
function fmtTime(ts) {
  const d = new Date(ts), p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}
let toastTimer;
function toast(msg, ms = 2200) {
  const el = $('#toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), ms);
}
async function copyText(t) {
  try { await navigator.clipboard.writeText(t); toast('已复制'); return; } catch {}
  const ta = document.createElement('textarea');
  ta.value = t; document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); toast('已复制'); } catch { toast('复制失败'); }
  ta.remove();
}
function joinUrl(base, path) {
  if (!base) return path || '';
  return base.replace(/\/+$/, '') + '/' + String(path || '').replace(/^\/+/, '');
}
function downloadImg(src, name) {
  const a = document.createElement('a');
  a.href = src; a.download = name; a.rel = 'noopener';
  document.body.appendChild(a); a.click(); a.remove();
}

/* ============================================================
 * 比例 → 4K 尺寸
 * ============================================================ */
const RATIOS = {
  '1:1':  { w: 1,  h: 1,  size: '4096x4096' },
  '3:4':  { w: 3,  h: 4,  size: '3072x4096' },
  '9:16': { w: 9,  h: 16, size: '2304x4096' },
  '16:9': { w: 16, h: 9,  size: '4096x2304' }
};
let currentRatio = '1:1';

/* ============================================================
 * 本地数据
 * ============================================================ */
const CFG_KEY = 'ia_cfg_v6', HIS_KEY = 'ia_history_v6', DRAFT_KEY = 'ia_draft_v6', VH_KEY = 'ia_vision_history_v6';

const DEFAULT_CFG = { baseUrl: '', apiKey: '', models: [], genModel: '', visionModel: '' };

let cfg = Object.assign({}, DEFAULT_CFG, store.get(CFG_KEY, {}));
if (!Array.isArray(cfg.models)) cfg.models = [];

let history = (store.get(HIS_KEY, []) || []).map(h => {
  const thumbs = Array.isArray(h.thumbs) && h.thumbs.length ? h.thumbs : [];
  return Object.assign({}, h, { thumbs, images: thumbs.slice() });
});
let visionHistory = store.get(VH_KEY, []) || [];

let refImage = null;
let generating = false;
let currentView = 'generate';

function saveCfg() { store.set(CFG_KEY, cfg); }

function saveHistory() {
  const lean = history.map(h => ({
    id: h.id, ts: h.ts, prompt: h.prompt,
    ratio: h.ratio, resolution: h.resolution, model: h.model,
    thumbs: h.thumbs || []
  }));
  let list = lean.slice(0, 40);
  while (list.length) {
    if (store.set(HIS_KEY, list)) return;
    list = list.slice(0, list.length - 1);
  }
  store.del(HIS_KEY);
}
function saveVisionHistory() {
  let list = visionHistory.slice(0, 24);
  while (list.length) {
    if (store.set(VH_KEY, list)) return;
    list = list.slice(0, list.length - 1);
  }
  store.del(VH_KEY);
}

const apiReady = () => !!(cfg.baseUrl && cfg.models.length);
const genModel = () => cfg.genModel || cfg.models[0] || '';
const visionModel = () => cfg.visionModel || cfg.models[0] || '';

/* ============================================================
 * 内置数据
 * ============================================================ */
const RANDOM_PROMPTS = [
  '赛博朋克雨夜街景，密集霓虹招牌，湿滑地面反射灯光，蒸汽与雾气，超广角，电影级调色，高细节，8k',
  '电影感侧光人像，年轻女性，柔和伦勃朗光，浅景深，85mm 镜头，背景虚化的城市夜景，胶片颗粒，高细节皮肤质感',
  '清晨雪山日出，金色阳光洒在雪峰顶，云海翻涌，前景冰湖倒影，超广角，HDR，风光摄影，极致细节',
  '极简产品广告摄影，磨砂玻璃香水瓶置于水面上，柔光箱打光，水面倒影，浅灰背景，商业广告级，超高清',
  '国风厚涂插画，红衣女子执剑立于竹林中，衣袂飘逸，水墨与厚涂结合，青绿色调，逆光轮廓，东方美学',
  '3D 渲染机械猫角色，金属与电路纹理，发光蓝色眼睛，深色渐变背景，产品级三点打光，超写实，8k',
  '奇幻漂浮岛屿，瀑布从岛边缘倾泻而下，逆光，晨雾，远处飞鸟，数字绘画，史诗感构图',
  '日式枯山水庭院，木质回廊，苔藓与石灯笼，晨雾，宁静氛围，自然光，写实摄影'
];

const CASES = [
  { title:'赛博朋克雨夜', emoji:'🌃', grad:['#5b21b6','#0ea5e9'],

function authHeaders(withBody = false) {
  const h = withBody ? { 'Content-Type': 'application/json' } : {};
  if (cfg.apiKey) h['Authorization'] = 'Bearer ' + cfg.apiKey.trim();
  return h;
}

async function apiFetchModels() {
  if (!cfg.baseUrl) throw new Error('请先填写接口地址');
  const url = joinUrl(cfg.baseUrl, '/models');
  let res;
  try { res = await fetch(url, { headers: authHeaders() }); }
  catch (e) { throw new Error('网络请求失败（可能是跨域限制）'); }

  const raw = await res.text();
  if (!res.ok) throw new Error('HTTP ' + res.status + '：' + raw.slice(0, 120));

  let json;
  try { json = JSON.parse(raw); } catch { throw new Error('返回内容不是 JSON'); }

  let arr = Array.isArray(json) ? json : (json.data || json.models || json.result || json.list || []);
  if (!Array.isArray(arr)) arr = [];

  const ids = arr.map(x => {
    if (typeof x === 'string') return x;
    if (x && typeof x === 'object') return x.id || x.name || x.model || x.model_name || '';
    return '';
  }).filter(Boolean);

  const uniq = [...new Set(ids)];
  if (!uniq.length) throw new Error('未解析到模型列表');
  return uniq;
}

function autoPickModels() {
  if (!cfg.models.length) return;
  if (!cfg.genModel || !cfg.models.includes(cfg.genModel)) {
    const pref = cfg.models.find(m => /image|dall|flux|sdxl|stable|diffusion|imagen|seedream|kling|jimeng|draw/i.test(m));
    cfg.genModel = pref || cfg.models[0];
  }
  if (!cfg.visionModel || !cfg.models.includes(cfg.visionModel)) {
    const pref = cfg.models.find(m => /(^|[-_/])vl|vision|gpt-4o|gpt-4\.1|claude|gemini|qwen.*vl|glm-4v|internvl|llava/i.test(m));
    cfg.visionModel = pref || cfg.models[0];
  }
  saveCfg();
}

async function refreshModels(showToast = true) {
  if (!cfg.baseUrl) { if (showToast) toast('请先填写接口地址'); return false; }
  if (showToast) toast('正在获取模型…');
  try {
    const ids = await apiFetchModels();
    cfg.models = ids;
    autoPickModels();
    saveCfg();
    updateModelUI();
    renderCfgStatus();
    if ($('#modelModal').classList.contains('show')) renderModelList();
    if (showToast) toast(`已获取 ${ids.length} 个模型`);
    return true;
  } catch (err) {
    if (showToast) toast('获取失败：' + err.message, 3600);
    return false;
  }
}

/* ---------- 缩略图 ---------- */
function makeThumb(src, maxSide = 380) {
  return new Promise(resolve => {
    if (!src) return resolve('');
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = () => {
      try {
        const scale = Math.min(1, maxSide / Math.max(img.naturalWidth, img.naturalHeight));
        const c = document.createElement('canvas');
        c.width = Math.max(1, Math.round(img.naturalWidth * scale));
        c.height = Math.max(1, Math.round(img.naturalHeight * scale));
        const ctx = c.getContext('2d');
        ctx.fillStyle = '#f7f6f4';
        ctx.fillRect(0, 0, c.width, c.height);
        ctx.drawImage(img, 0, 0, c.width, c.height);
        resolve(c.toDataURL('image/jpeg', 0.72));
      } catch { resolve(''); }
    };
    img.onerror = () => resolve('');
    img.src = src;
  });
}

async function doGenerate() {
  if (generating) return;
  const prompt = $('#promptInput').value.trim();
  if (!prompt) { toast('请先输入提示词'); $('#promptInput').focus(); return; }

  const model = genModel();
  const ratio = currentRatio;
  const size = (RATIOS[ratio] || RATIOS['1:1']).size;
  const count = parseInt($('#countSelect').value, 10) || 1;
  const useAPI = !!(cfg.baseUrl && model);

  generating = true;
  startProgress();

  try {
    let images = [];
    if (useAPI) {
      images = await callImageAPI({ model, prompt, size, count, ref: refImage });
    } else {
      await sleep(280);
      images = Array.from({ length: count }, (_, i) =>
        makePlaceholder(prompt + (i ? ` #${i + 1}` : ''), ratio));
      toast('未配置接口，使用演示占位图', 2400);
    }
    if (!images.length) throw new Error('接口未返回图片');

    const thumbs = [];
    for (const src of images) thumbs.push(await makeThumb(src));

    const item = {
      id: uid(), ts: Date.now(), prompt,
      ratio, resolution: '4K', size, model, count,
      images, thumbs
    };

    history.unshift(item);
    saveHistory();
    renderHistory();
    renderGenResult();

    finishProgress(true);
    toast('生成成功');
  } catch (err) {
    console.error(err);
    finishProgress(false);
    toast('生成失败：' + err.message, 3600);
  } finally {
    generating = false;
  }
}

/* ---------- 响应解析 ---------- */
function pickPath(obj, path) {
  if (!path) return null;
  return path.split('.').reduce((o, k) => (o == null ? null : o[k]), obj);
}
function looksLikeImageString(s) {
  if (typeof s !== 'string' || s.length < 20) return false;
  if (/^data:image\//i.test(s)) return true;
  if (/^https?:\/\//i.test(s)) return true;
  if (/^[A-Za-z0-9+/=\s]{200,}$/.test(s) && !/\s/.test(s)) return true;
  return false;
}
function toImageSrc(s) {
  if (/^data:image\//i.test(s)) return s;
  if (/^https?:\/\//i.test(s)) return s;
  if (/^blob:/i.test(s)) return s;
  return 'data:image/png;base64,' + s.replace(/\s/g, '');
}
function extractImages(json) {
  const candidates = [];
  ['data', 'images', 'output', 'result', 'artifacts'].forEach(p => {
    const v = pickPath(json, p);
    if (v) candidates.push(v);
  });

  const out = [];
  const visit = x => {
    if (!x) return;
    if (typeof x === 'string') { if (looksLikeImageString(x)) out.push(toImageSrc(x)); return; }
    if (Array.isArray(x)) { x.forEach(visit); return; }
    if (typeof x === 'object') {
      if (x.b64_json) out.push(toImageSrc(x.b64_json));
      else if (x.url) out.push(x.url);
      else if (x.image_url) out.push(typeof x.image_url === 'string' ? x.image_url : (x.image_url.url || ''));
      else Object.values(x).forEach(visit);
    }
  };
  candidates.forEach(visit);

  return [...new Set(out.filter(Boolean))];
}
async function toDataUrl(src) {
  if (!/^https?:/i.test(src)) return src;
  try {
    const r = await fetch(src, { mode: 'cors' });
    if (!r.ok) return src;
    const blob = await r.blob();
    return await new Promise(res => {
      const fr = new FileReader();
      fr.onload = () => res(fr.result);
      fr.onerror = () => res(src);
      fr.readAsDataURL(blob);
    });
  } catch { return src; }
}

async function callImageAPI({ model, prompt, size, count, ref }) {
  const url = joinUrl(cfg.baseUrl, '/images/generations');
  const body = { model, prompt, n: count, size };
  if (ref) body.image = ref;

  let res;
  try {
    res = await fetch(url, {
      method: 'POST',
      headers: authHeaders(true),
      body: JSON.stringify(body)
    });
  } catch (e) { throw new Error('网络请求失败（可能是跨域限制）'); }

  const raw = await res.text();
  if (!res.ok) throw new Error(`HTTP ${res.status}：${raw.slice(0, 180)}`);

  let json;
  try { json = JSON.parse(raw); } catch { throw new Error('返回内容不是 JSON'); }

  const imgs = extractImages(json);
  if (!imgs.length) {
    if (json.error) throw new Error(json.error.message || JSON.stringify(json.error).slice(0, 160));
    throw new Error('未能从响应中解析出图片');
  }
  return await Promise.all(imgs.map(toDataUrl));
}

/* ---------- 演示占位图 ---------- */
function hashStr(s) {
  let h = 2166136261;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return Math.abs(h);
}
function wrapText(ctx, text, maxW) {
  const lines = [];
  let line = '';
  for (const ch of Array.from(text)) {
    if (ch === '\n') { lines.push(line); line = ''; continue; }
    if (ctx.measureText(line + ch).width > maxW && line) { lines.push(line); line = ch; }
    else line += ch;
  }
  if (line) lines.push(line);
  return lines;
}
function makePlaceholder(prompt, ratio) {
  const r = RATIOS[ratio] || RATIOS['1:1'];
  const cw = 640;
  const ch = Math.round(cw * r.h / r.w);
  const c = document.createElement('canvas');
  c.width = cw; c.height = ch;
  const ctx = c.getContext('2d');

  const seed = hashStr(prompt);
  const hue = seed % 360, hue2 = (hue + 70 + seed % 90) % 360;
  const g = ctx.createLinearGradient(0, 0, cw, ch);
  g.addColorStop(0, `hsl(${hue} 30% 72%)`);
  g.addColorStop(1, `hsl(${hue2} 32% 58%)`);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, cw, ch);

  for (let i = 0; i < 14; i++) {
    const rad = 30 + (seed >> (i % 8)) % 140;
    const x = (seed * (i + 3)) % cw;
    const y = (seed * (i + 7)) % ch;
    ctx.beginPath();
    ctx.arc(x, y, rad, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(255,255,255,${0.03 + (i % 4) * 0.012})`;
    ctx.fill();
  }

  ctx.textAlign = 'center';
  ctx.fillStyle = 'rgba(255,255,255,.9)';
  ctx.font = '500 18px "Inter","PingFang SC",sans-serif';
  const lines = wrapText(ctx, prompt, cw - 90).slice(0, 6);
  const startY = ch / 2 - (lines.length - 1) * 15;
  lines.forEach((l, i) => ctx.fillText(l, cw / 2, startY + i * 30));

  ctx.font = '11px "Inter",sans-serif';
  ctx.fillStyle = 'rgba(255,255,255,.55)';
  ctx.fillText(`演示 · 4K · ${ratio}`, cw / 2, ch - 26);

  return c.toDataURL('image/png');
}

let viewerImages = [], viewerIndex = 0, viewerItemId = null;
let vScale = 1, vX = 0, vY = 0, vDragging = false, vStartX = 0, vStartY = 0;

function applyViewerTransform() {
  const img = $('#viewerImg');

  $('#viewerImg').src = viewerImages[viewerIndex];
  vScale = 1; vX = 0; vY = 0;
  applyViewerTransform();
  const multi = viewerImages.length > 1;
  $('#viewerPager').textContent = multi ? `${viewerIndex + 1} / ${viewerImages.length}` : '';
  $('#viewerPrev').style.display = multi && viewerIndex > 0 ? 'grid' : 'none';
  $('#viewerNext').style.display = multi && viewerIndex < viewerImages.length - 1 ? 'grid' : 'none';
}

function openViewer(images, index, itemId) {
  if (!images || !images.length) return;
  viewerImages = images;
  viewerIndex = Math.max(0, Math.min(index || 0, images.length - 1));
  viewerItemId = itemId || null;
  showViewerImage();
  $('#imgViewer').classList.add('show');
  document.body.style.overflow = 'hidden';
}

function closeViewer() {
  $('#imgViewer').classList.remove('show');
  document.body.style.overflow = '';
  viewerImages = []; viewerItemId = null;
}

function zoomBy(f) {
  vScale = Math.min(8, Math.max(0.2, vScale * f));
  applyViewerTransform();
}
function resetView() { vScale = 1; vX = 0; vY = 0; applyViewerTransform(); }

const stageEl = $('#viewerStage');

stageEl.addEventListener('wheel', e => {
  e.preventDefault();
  zoomBy(e.deltaY > 0 ? 0.88 : 1.12);
}, { passive: false });

stageEl.addEventListener('pointerdown', e => {
  if (!e.isPrimary) return;
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  vDragging = true;
  vStartX = e.clientX - vX;
  vStartY = e.clientY - vY;
  try { stageEl.setPointerCapture(e.pointerId); } catch {}
});

stageEl.addEventListener('pointermove', e => {
  if (!vDragging || !e.isPrimary) return;
  vX = e.clientX - vStartX;
  vY = e.clientY - vStartY;
  applyViewerTransform();
});

stageEl.addEventListener('pointerup', e => {
  vDragging = false;
  try { stageEl.releasePointerCapture(e.pointerId); } catch {}
});
stageEl.addEventListener('pointercancel', () => { vDragging = false; });
stageEl.addEventListener('dblclick', resetView);

let pinchStartDist = 0, pinchStartScale = 1;
stageEl.addEventListener('touchstart', e => {
  if (e.touches.length === 2) {
    vDragging = false;
    pinchStartDist = Math.hypot(
      e.touches[0].clientX - e.touches[1].clientX,
      e.touches[0].clientY - e.touches[1].clientY
    );
    pinchStartScale = vScale;
  }
}, { passive: true });

stageEl.addEventListener('touchmove', e => {
  if (e.touches.length === 2) {
    e.preventDefault();
    const dist = Math.hypot(
      e.touches[0].clientX - e.touches[1].clientX,
      e.touches[0].clientY - e.touches[1].clientY
    );
    vScale = Math.min(8, Math.max(0.2, pinchStartScale * (dist / pinchStartDist)));
    applyViewerTransform();
  }
}, { passive: false });

function fileToDataUrl(file, maxSide = 1024, quality = 0.86) {
  return new Promise((resolve, reject) => {
    if (!file.type.startsWith('image/')) return reject(new Error('请选择图片文件'));
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      let w = img.naturalWidth, h = img.naturalHeight;
      const scale = Math.min(1, maxSide / Math.max(w, h));
      w = Math.max(1, Math.round(w * scale));
      h = Math.max(1, Math.round(h * scale));
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#fff';
      ctx.fillRect(0, 0, w, h);
      ctx.drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url);
      resolve(c.toDataURL('image/jpeg', quality));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('图片解析失败')); };
    img.src = url;
  });
}

function cleanPrompt(t) {
  let s = String(t == null ? '' : t).trim();
  s = s.replace(/^```[a-zA-Z]*\s*/, '').replace(/```\s*$/, '').trim();
  s = s.replace(/^(提示词|Prompt)\s*[:：]\s*/i, '');
  s = s.replace(/^["“']|["”']$/g, '').trim();
  return s;
}
function deepCollectText(node, out, depth = 0) {
  if (node == null || depth > 7) return;
  if (typeof node === 'string') {
    if (node.length >= 6 && !looksLikeImageString(node)) out.push(node);
    return;
  }
  if (Array.isArray(node)) { node.forEach(n => deepCollectText(n, out, depth + 1)); return; }
  if (typeof node === 'object') Object.values(node).forEach(v => deepCollectText(v, out, depth + 1));
}
function extractText(json) {
  const c = pickPath(json, 'choices.0.message.content');
  if (typeof c === 'string' && c.trim()) return c;
  if (Array.isArray(c)) {
    const joined = c.map(x => (typeof x === 'string' ? x : (x && (x.text || x.content)) || '')).join('\n');
    if (joined.trim()) return joined;
  }
  for (const p of ['choices.0.text', 'output.text', 'result', 'response', 'content', 'text', 'message.content', 'data.0.content']) {
    const v = pickPath(json, p);
    if (typeof v === 'string' && v.trim()) return v;
    if (Array.isArray(v)) {
      const j = v.map(x => (typeof x === 'string' ? x : (x && (x.text || x.content)) || '')).join('\n');
      if (j.trim()) return j;
    }
  }
  const arr = [];
  deepCollectText(json, arr);
  arr.sort((a, b) => b.length - a.length);
  return arr[0] || '';
}

async function callVisionAPI(imageDataUrl) {
  const model = visionModel();
  if (!cfg.baseUrl || !model) throw new Error('请先在设置中配置接口并获取模型');

  const url = joinUrl(cfg.baseUrl, '/chat/completions');
  const lang = $('#visionLang').value === 'en' ? '英文' : '中文';
  const style = $('#visionStyle').value;
  const styleMap = {
    detailed: '请输出一段详细、可直接用于 AI 生图模型的提示词，覆盖主体、构图、光影、材质、镜头、风格与色调等细节，中文 80–160 字（英文不超过 120 词），只输出提示词正文，不要分点、不要解释。',
    concise: '请输出一句简洁的生图提示词，保留最关键的主体、风格与光影信息，中文 30–60 字，只输出提示词正文，不要解释。',
    tags: '请以英文逗号分隔的标签形式输出生图提示词关键词（主体、风格、光影、画质等），10–20 个标签，只输出标签，不要解释。'
  };
  const userText = `你是一名资深的 AI 绘画提示词工程师。请仔细观察这张图片，用${lang}输出可用于复现该画面的提示词。${styleMap[style] || styleMap.detailed}`;

  const body = {
    model,
    messages: [{
      role: 'user',
      content: [
        { type: 'text', text: userText },
        { type: 'image_url', image_url: { url: imageDataUrl } }
      ]
    }]
  };

  let res;
  try {
    res = await fetch(url, { method: 'POST', headers: authHeaders(true), body: JSON.stringify(body) });
  } catch (e) { throw new Error('网络请求失败（可能是跨域限制）'); }

  const raw = await res.text();
  if (!res.ok) throw new Error(`HTTP ${res.status}：${raw.slice(0, 180)}`);

  let json;
  try { json = JSON.parse(raw); } catch { throw new Error('返回内容不是 JSON'); }

  const text = cleanPrompt(extractText(json));
  if (!text) throw new Error('未能解析出提示词内容');
  return text;
}

  const btn = $('#btnVision');
  btn.disabled = on;
  btn.innerHTML = on
    ? '<span class="btn-text"><span class="spinner"></span>分析中…</span>'
    : '<span class="btn-text">获取提示词</span>';

async function doVision() {
  if (visionLoading) return;
  if (!visionImage) { toast('请先上传一张图片'); return; }
  if (!cfg.baseUrl || !visionModel()) {
    toast('请先在设置中配置接口并获取模型');
    switchView('settings');
    return;
  }
  visionLoading = true;
  setVisionLoading(true);
  try {
    const model = visionModel();
    const text = await callVisionAPI(visionImage);
    visionResultPrompt = text;
    visionResultModel = model;
    renderVisionResult();

    const thumb = await makeThumb(visionImage, 220);
    visionHistory.unshift({ id: uid(), ts: Date.now(), prompt: text, thumb, model });
    saveVisionHistory();
    renderVisionHistory();
    toast('提示词获取成功');
  } catch (err) {
    console.error(err);
    toast('反推失败：' + err.message, 3800);
  } finally {
    visionLoading = false;
    setVisionLoading(false);
  }
}

  renderHistory();
  renderGenResult();
  renderVisionResult();
  renderVisionHistory();
  updateModelUI();
  toast('已恢复初始状态');
});

document.addEventListener('click', e => {
  if (e.target.id === 'goVisionSettings') switchView('settings');
});

/* ============================================================
 * 初始化
 * ============================================================ */
function init() {
  renderSettings();
  renderCases();
  renderHistory();
  renderGenResult();
  renderVisionHistory();
  setRatio('1:1');
  updateModelUI();

  const draft = store.get(DRAFT_KEY, '');
  if (draft) $('#promptInput').value = draft;
  updatePromptCount();

  switchView('generate');
}
init();
</script>
</body>
