<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>灵境</title>
<style>
html,body{height:100%;margin:0;background:#e7efe8;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
#appFrame{position:fixed;inset:0;width:100%;height:100%;border:0;background:transparent}
#updateModal{position:fixed;inset:0;z-index:20;display:none;align-items:flex-end;justify-content:center;padding:18px;background:rgba(16,28,22,.34)}
#updateModal.show{display:flex}
.update-card{width:min(420px,100%);margin-bottom:74px;padding:24px 20px 18px;border:1px solid rgba(255,255,255,.66);border-radius:24px;background:rgba(252,253,251,.9);box-shadow:0 18px 48px rgba(18,39,27,.2)}
.update-kicker{font-size:11px;letter-spacing:.16em;color:#75907d}
.update-card h3{margin:8px 0;font-size:22px}
.update-card p{margin:0;color:#52675b;font-size:14px;line-height:1.7}
.update-notes{max-height:110px;margin-top:12px;overflow:auto;white-space:pre-wrap;color:#31483b}
.update-actions{display:flex;gap:10px;margin-top:18px}
.update-actions button{flex:1;min-height:46px;border-radius:14px;font:inherit}
#updateLater{border:1px solid #d7e2d8;background:#fff;color:#476354}
#updateNow{border:0;background:#305d48;color:#fff}
#updateNow:disabled{opacity:.65}
@media(min-width:761px){#updateModal{align-items:center}.update-card{margin:0}}
</style>
</head>
<body>
<iframe id="appFrame" title="灵境应用" hidden></iframe>
<div id="updateModal" role="dialog" aria-modal="true" aria-labelledby="updateTitle">
  <div class="update-card">
    <div class="update-kicker">APP UPDATE</div>
    <h3 id="updateTitle">发现新版本</h3>
    <p id="updateMessage">有新版本可以更新。</p>
    <div class="update-notes" id="updateNotes" hidden></div>
    <div class="update-actions">
      <button id="updateLater" type="button">稍后</button>
      <button id="updateNow" type="button">立即更新</button>
    </div>
  </div>
</div>
<script>
const GITHUB_REPO = 'ccc2200ccc/stapp';
const VERSION_KEY = 'ia_confirmed_version_v1';
const HTML_KEY = 'ia_confirmed_html_v1';
const frame = document.getElementById('appFrame');
const modal = document.getElementById('updateModal');
let pendingUpdate = null;

function compareVersions(a = '', b = '') {
  const left = String(a).replace(/^v/i, '').split('.').map(n => parseInt(n, 10) || 0);
  const right = String(b).replace(/^v/i, '').split('.').map(n => parseInt(n, 10) || 0);
  const count = Math.max(left.length, right.length);
  for (let i = 0; i < count; i++) {
    if ((left[i] || 0) > (right[i] || 0)) return 1;
    if ((left[i] || 0) < (right[i] || 0)) return -1;
  }
  return 0;
}
function showApp(html) {
  frame.hidden = false;
  frame.srcdoc = html;
}
function showUpdate(info) {
  pendingUpdate = info;
  document.getElementById('updateTitle').textContent = `发现新版本 ${info.version}`;
  document.getElementById('updateMessage').textContent = '点击「立即更新」后才会替换应用内容。';
  document.getElementById('updateNotes').hidden = !info.notes;
  document.getElementById('updateNotes').textContent = info.notes || '';
  document.getElementById('updateNow').disabled = false;
  document.getElementById('updateNow').textContent = '立即更新';
  modal.classList.add('show');
}
async function githubText(path, sha) {
  const res = await fetch(`https://raw.githubusercontent.com/${GITHUB_REPO}/${sha}/${path}`, { cache: 'no-store' });
  if (!res.ok) throw new Error('读取失败');
  return res.text();
}
async function latestRelease() {
  const res = await fetch(`https://api.github.com/repos/${GITHUB_REPO}/commits/main`, { cache: 'no-store', headers: { Accept: 'application/vnd.github+json' } });
  if (!res.ok) throw new Error('无法连接 GitHub');
  const sha = (await res.json()).sha;
  const info = JSON.parse(await githubText('version.json', sha));
  if (!sha || !info.version) throw new Error('版本信息不完整');
  return { ...info, sha };
}
async function confirmUpdate() {
  const html = await githubText('app.html', pendingUpdate.sha);
  if (!/<html[\s>]/i.test(html)) throw new Error('更新内容无效');
  localStorage.setItem(VERSION_KEY, pendingUpdate.version);
  localStorage.setItem(HTML_KEY, html);
  modal.classList.remove('show');
  showApp(html);
}
async function boot() {
  const savedVersion = localStorage.getItem(VERSION_KEY) || '';
  const savedHtml = localStorage.getItem(HTML_KEY) || '';
  if (savedHtml) showApp(savedHtml);
  else {
    const local = await fetch('app.html').then(res => res.ok ? res.text() : '').catch(() => '');
    if (local) showApp(local);
  }
  try {
    const info = await latestRelease();
    if (!savedVersion || compareVersions(info.version, savedVersion) > 0) showUpdate(info);
  } catch {}
}
document.getElementById('updateLater').addEventListener('click', () => modal.classList.remove('show'));
document.getElementById('updateNow').addEventListener('click', async () => {
  const button = document.getElementById('updateNow');
  button.disabled = true;
  button.textContent = '正在更新…';
  try { await confirmUpdate(); }
  catch { button.disabled = false; button.textContent = '立即更新'; }
});
boot();
</script>
</body>
</html>
